<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recover AI</title>
    <meta
      name="description"
      content="Diagnose failed Razorpay payments and drive compliant, bounded recovery."
    />
    <script>
      // Set theme before paint to avoid a flash. Dark-first: dark unless a
      // stored choice or the OS explicitly asks for light.
      try {
        const t = localStorage.getItem("recover-ai-theme");
        const light = t === "light" || (!t && window.matchMedia("(prefers-color-scheme: light)").matches);
        document.documentElement.classList.toggle("dark", !light);
      } catch (_) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
