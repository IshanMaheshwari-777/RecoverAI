[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "revenue-recovery-agent"
version = "1.0.0"
description = "An AI agent that diagnoses failed Razorpay payments and drives compliant, bounded recovery."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Swanand M", email = "swanandm@gmail.com" }]
keywords = ["razorpay", "payments", "revenue-recovery", "agent", "fintech"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Office/Business :: Financial",
]

dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "rich>=13.7",
    "structlog>=24.1",
    "anthropic>=1.1",
    "razorpay>=2.0",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[project.scripts]
revenue-recovery = "revenue_recovery.cli:app"

[project.urls]
Homepage = "https://github.com/swanandm/revenue-recovery-agent"
Documentation = "https://github.com/swanandm/revenue-recovery-agent/tree/main/docs"

[tool.hatch.build.targets.wheel]
packages = ["src/revenue_recovery"]
# the built dashboard (git-ignored) is bundled into the wheel when present;
# absent on a fresh clone -> `make build-web` produces it
artifacts = ["src/revenue_recovery/api/static/**/*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "PT", "SIM", "RUF", "BLE"]
ignore = ["A003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501", "PT018", "A002", "N818"]

[tool.ruff.lint.isort]
known-first-party = ["revenue_recovery"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
strict = true
warn_return_any = true
disallow_untyped_defs = true
exclude = ["tests/"]

[[tool.mypy.overrides]]
module = ["razorpay.*", "anthropic.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --cov=revenue_recovery --cov-report=term-missing"
asyncio_mode = "auto"
markers = [
    "live: hits a real external API (Razorpay / Anthropic); run explicitly with -m live",
]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
